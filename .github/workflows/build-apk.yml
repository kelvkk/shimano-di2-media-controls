name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # app/build.gradle.kts calls `magick` (ImageMagick 7) to generate icons;
      # the runner ships ImageMagick 6, which only has `convert`.
      - name: Provide magick command
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          command -v magick || sudo ln -s "$(command -v convert)" /usr/local/bin/magick

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: di2-media-controls-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
