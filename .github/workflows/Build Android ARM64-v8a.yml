name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK preinstalled (ANDROID_HOME).
      # Just accept licenses and make sure the platform used by the project exists.
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35"

      - uses: gradle/actions/setup-gradle@v4

      # app/build.gradle.kts calls `magick` (ImageMagick 7) to generate icons;
      # the runner ships ImageMagick 6, which only has `convert`.
      - name: Provide magick command
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          command -v magick || sudo ln -s "$(command -v convert)" /usr/local/bin/magick

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk di2-media-controls-20261004v3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: di2-media-controls-20261004v3-fix
          path: di2-media-controls-20261004v3-fix.apk
